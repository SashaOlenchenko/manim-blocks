<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Manim Blocks - First Test</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 20px;
    }
    .container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      align-items: start;
    }
    .column {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    #blocklyDiv {
      width: 100%;
      aspect-ratio: 16 / 9;
      border: 1px solid #ccc;
    }
    #resultVideo {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
    }
    #outputArea {
      background: #f5f5f5;
      padding: 10px;
      overflow: auto;
      max-height: 200px;
    }
    #statusMessage {
      min-height: 20px;
      font-size: 14px;
    }
    #statusMessage.error {
      color: #c0392b;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="column">
      <div id="workspaceToolbar">
        <button id="saveButton">Save</button>
        <button id="clearButton">Clear Workspace</button>
        <span id="saveStatus"></span>
      </div>
      <div id="blocklyDiv"></div>
      <button id="showCodeButton">Show Generated Code</button>
      <pre id="outputArea"></pre>
    </div>
    <div class="column">
      <video id="resultVideo" controls></video>
      <button id="renderButton">Render</button>
      <label for="qual">Select quality:</label>
      <select name="quality", id="qual">
        <option value="ql">Low</option>
        <option value="qm">Medium</option>
        <option value="qh">High</option>
        <option value="qk">4k</option>
      </select>
      <div id="statusMessage"></div>
    </div>
  </div>

  <script src="https://unpkg.com/blockly/blockly_compressed.js"></script>
  <script src="https://unpkg.com/blockly/blocks_compressed.js"></script>
  <script src="https://unpkg.com/blockly/python_compressed.js"></script>
  <script src="https://unpkg.com/blockly/msg/en.js"></script>
  <script src="https://unpkg.com/@blockly/field-colour"></script>

  <script>
    registerFieldColour();

    // ---- 1. Define the blocks ----
    Blockly.Blocks['circle'] = {
      init: function() {
        this.appendDummyInput()
            .appendField("Circle")
            .appendField("radius")
            .appendField(new Blockly.FieldNumber(1, 0, 100), "RADIUS")
        this.setOutput(true, "Mobject");
        this.setColour(230);
        this.setTooltip("Creates a Circle Mobject");
      }
    };
    Blockly.Blocks['rectangle'] = {
      init: function() {
        this.appendDummyInput()
            .appendField("Rectangle")
            .appendField("width")
            .appendField(new Blockly.FieldNumber(2, 0, 100), "WIDTH")
            .appendField("height")
            .appendField(new Blockly.FieldNumber(1, 0, 100), "HEIGHT")
        this.setOutput(true, "Mobject");
        this.setColour(230);
        this.setTooltip("Creates a Rectangle Mobject");
      }
    };

    Blockly.Blocks['text']= {
      init: function() {
          this.appendDummyInput()
              .appendField("Text")
              .appendField(new Blockly.FieldTextInput(''), "TEXT")
              .appendField("size")
              .appendField(new Blockly.FieldNumber(48, 1, 100), "FONT_SIZE")
          this.setOutput(true, "Mobject");
          this.setColour(230);
          this.setTooltip("Creates a Text Mobject");
      }
    }
    Blockly.Blocks['tex']= {
      init: function() {
          this.appendDummyInput()
              .appendField("Tex")
              .appendField(new Blockly.FieldTextInput(''), "TEX")
              .appendField("size")
              .appendField(new Blockly.FieldNumber(48, 1, 100), "FONT_SIZE")
          this.setOutput(true, "Mobject");
          this.setColour(230);
          this.setTooltip("Creates a Tex Mobject");
      }
    }
    Blockly.Blocks['math_tex']= {
      init: function() {
          this.appendDummyInput()
              .appendField("MathTex")
              .appendField(new Blockly.FieldTextInput(''), "TEX")
              .appendField("size")
              .appendField(new Blockly.FieldNumber(48, 1, 100), "FONT_SIZE")
          this.setOutput(true, "Mobject");
          this.setColour(230);
          this.setTooltip("Creates a MathTex Mobject");
      }
    }
    
    // ---- Animation blocks (statement blocks, not value blocks) ----
    // ---- Animation Blocks Factory
    function defineAnimationBlock(config) {
      Blockly.Blocks[config.type] = {
        init: function() {
          this.appendValueInput('MOBJECT')
          .setCheck('Mobject')
          .appendField(config.name);
        this.setPreviousStatement(true, ["Animation", "Action"]);
        this.setNextStatement(true, ["Animation", "Action"]);
        this.setColour(config.colour);
          if (config.tooltip) this.setTooltip(config.tooltip);
        }
      };
      python.pythonGenerator.forBlock[config.type] = function(block, generator) {
      var mobject = generator.valueToCode(block, 'MOBJECT', python.Order.NONE) || 'None';
      var expr = config.anim + '(' + mobject + ')';
      if (isInsideAnimationGroup(block)) {
        return expr + ',\n';
      }
      return 'self.play(' + expr + ')\n';
    };
  }
  defineAnimationBlock({
      type: 'anim_create',
      name: 'Create',
      colour: 260,
      anim: 'Create'
    })
  defineAnimationBlock({
      type: 'anim_uncreate',
      name: 'Uncreate',
      colour: 260,
      anim: 'Uncreate'
    })
      defineAnimationBlock({
      type: 'anim_fadein',
      name: 'Fade In',
      colour: 260,
      anim: 'FadeIn'
    })
      defineAnimationBlock({
      type: 'anim_fadeout',
      name: 'Fade Out',
      colour: 260,
      anim: 'FadeOut'
    })
      defineAnimationBlock({
      type: 'anim_write',
      name: 'Write',
      colour: 260,
      anim: 'Write'
    })
      defineAnimationBlock({
      type: 'anim_unwrite',
      name: 'Unwrite',
      colour: 260,
      anim: 'Unwrite'
    })
    Blockly.Blocks['anim_transform'] = 
    {
      init: function() {
        this.appendDummyInput()
            .appendField("Transform")
        this.appendValueInput('MOBJECT')
            .setCheck('Mobject')
        this.appendDummyInput()
            .appendField("into")
        this.appendValueInput('TARGET')
            .setCheck('Mobject')
        this.setInputsInline(true)
        this.setPreviousStatement(true, ["Animation", "Action"]);
        this.setNextStatement(true, ["Animation", "Action"]);
        this.setColour(260);
        this.setTooltip("Transforms one mobject into the shape of another");
      }
    }

    Blockly.Blocks['anim_replace'] = 
    {
      init: function() {
        this.appendDummyInput()
            .appendField("Replace")
        this.appendValueInput('MOBJECT')
            .setCheck('Mobject')
        this.appendDummyInput()
            .appendField("by")
        this.appendValueInput('TARGET')
            .setCheck('Mobject')
        this.setInputsInline(true)
        this.setPreviousStatement(true, ["Animation", "Action"]);
        this.setNextStatement(true, ["Animation", "Action"]);
        this.setColour(260);
        this.setTooltip("Replaces one mobject by another via Transform");
      }
    }

    Blockly.Blocks['anim_wait'] = {
      init: function() {
        this.appendDummyInput()
            .appendField("Wait")
            .appendField(new Blockly.FieldNumber(1, 0), "DURATION");
        this.setPreviousStatement(true, "Action");
        this.setNextStatement(true, "Action");
        this.setColour(260);
        this.setTooltip("Pauses the animation for a number of seconds");
      }
    };

    Blockly.Blocks['animation_group'] = {
      init: function() {
        this.appendDummyInput()
            .appendField("Animation Group")
            .appendField("lag ratio")
            .appendField(new Blockly.FieldNumber(0, 0, 1, 0.1), "LAG_RATIO");
        this.appendStatementInput("ANIMATIONS")
            .setCheck("Animation");
        this.setPreviousStatement(true, "Action");
        this.setNextStatement(true, "Action");
        this.setColour(210);
        this.setTooltip("Plays several animations together, optionally staggered by a lag ratio");
      }
    };
    Blockly.Blocks['apply_animation'] = {
      init: function() {
        this.appendValueInput('MOBJECT')
          .setCheck('Mobject')
          .appendField('Apply animation to');
        this.appendStatementInput('METHODS')
          .setCheck('Applyable');
        this.setPreviousStatement(true, ["Animation", "Action"]);
        this.setNextStatement(true, ["Animation", "Action"]);
        this.setColour(200);
        this.setTooltip("Animates one or more Positioning/Style changes on a Mobject using .animate");
      }
    };
    // ---- Shared dropdown options, to avoid repeating the same arrays ----
    var MANIM_COLOR_PALETTE = {
      options: [
        '#FC6255', '#F7A1A3', '#CF5044', '#FF0000',
        '#83C167', '#C9E2AE', '#699C52', '#00FF00',
        '#58C4DD', '#C7E9F1', '#236B8E', '#0000FF',
        '#F7D96F', '#FFF1B6', '#E8C11C', '#FFFF00',
        '#9A72AC', '#5CD0B3', '#D147BD',
        '#FF862F', '#C55F73', '#F0AC5F',
        '#888888', '#FFFFFF', '#000000'
      ],
      titles: [
        'RED', 'RED_A', 'RED_E', 'PURE_RED',
        'GREEN', 'GREEN_A', 'GREEN_E', 'PURE_GREEN',
        'BLUE', 'BLUE_A', 'BLUE_E', 'PURE_BLUE',
        'YELLOW', 'YELLOW_A', 'YELLOW_E', 'PURE_YELLOW',
        'PURPLE', 'TEAL', 'PINK',
        'ORANGE', 'MAROON', 'GOLD',
        'GRAY', 'WHITE', 'BLACK'
      ]
    };
    var DIRECTIONS = [
      ["right", "RIGHT"],
      ["left", "LEFT"],
      ["up", "UP"],
      ["down", "DOWN"]
    ];

    // ---- Factory for the shared shape of Positioning/Style blocks: ----
    // one Mobject socket, a handful of fields, and a generator that
    // returns either a full statement or a bare ".method(...)" fragment
    // when nested inside Apply Animation.
    function defineMobjectMethodBlock(config) {
      Blockly.Blocks[config.type] = {
        init: function() {
          if (config.leadingLabel) {
            this.appendDummyInput('').appendField(config.leadingLabel);
          }
          this.appendValueInput('MOBJECT').setCheck('Mobject');
          config.fields.forEach(function(f) {
            var input = this.appendDummyInput('');
            if (f.before) input.appendField(f.before);
            var field;
            if (f.kind === 'dropdown') {
              field = new Blockly.FieldDropdown(f.options);
            } else if (f.kind === 'colour') {
              field = Blockly.fieldRegistry.fromJson({
                type: 'field_colour',
                colour: f.default || '#ffffff',
                colourOptions: f.colourOptions || MANIM_COLOR_PALETTE.options,
                colourTitles: f.colourTitles || MANIM_COLOR_PALETTE.titles,
                columns: f.columns || 4
              });
            } else {
              field = new Blockly.FieldNumber(f.default, f.min, f.max, f.precision);
            }
            input.appendField(field, f.name);
            if (f.after) input.appendField(f.after);
          }, this);
          this.setInputsInline(true);
          this.setPreviousStatement(true, ["Action", "Applyable"]);
          this.setNextStatement(true, ["Action", "Applyable"]);
          this.setColour(config.colour);
          if (config.tooltip) this.setTooltip(config.tooltip);
        }
      };

      python.pythonGenerator.forBlock[config.type] = function(block, generator) {
        var mobject = generator.valueToCode(block, 'MOBJECT', python.Order.NONE) || 'None';
        var vals = {};
        config.fields.forEach(function(f) {
          vals[f.name] = block.getFieldValue(f.name);
        });
        var call = config.buildCall(vals);
        if (isInsideApplyAnimation(block)) {
          return call;
        }
        return mobject + call + '\n';
      };
    }

    // ---- Positioning blocks ----
    defineMobjectMethodBlock({
      type: 'move_to',
      leadingLabel: 'Move',
      colour: 225,
      fields: [
        { name: 'X', kind: 'number', default: 0, before: 'to', after: 'x' },
        { name: 'Y', kind: 'number', default: 0, after: 'y' }
      ],
      buildCall: function(v) { return '.move_to([' + v.X + ', ' + v.Y + ', 0])'; }
    });

    defineMobjectMethodBlock({
      type: 'shift',
      leadingLabel: 'Shift',
      colour: 225,
      fields: [
        { name: 'DX', kind: 'number', default: 0, before: 'by', after: 'x' },
        { name: 'DY', kind: 'number', default: 0, after: 'y' }
      ],
      buildCall: function(v) { return '.shift([' + v.DX + ', ' + v.DY + ', 0])'; }
    });

    defineMobjectMethodBlock({
      type: 'to_edge',
      colour: 225,
      fields: [
        { name: 'DIR', kind: 'dropdown', options: DIRECTIONS, before: 'to edge' }
      ],
      buildCall: function(v) { return '.to_edge(' + v.DIR + ')'; }
    });

    defineMobjectMethodBlock({
      type: 'to_corner',
      colour: 225,
      fields: [
        { name: 'CORNER', kind: 'dropdown', before: 'to corner', options: [
          ["top-left", "UL"],
          ["top-right", "UR"],
          ["bottom-left", "DL"],
          ["bottom-right", "DR"]
        ] }
      ],
      buildCall: function(v) { return '.to_corner(' + v.CORNER + ')'; }
    });

    defineMobjectMethodBlock({
      type: 'set_x',
      colour: 225,
      fields: [{
        name: 'X', kind: 'number', default: 0, before: 'set x'
      }],
      buildCall: function(v) {return '.set_x(' + v.X + ')'; }
    });

    defineMobjectMethodBlock({
      type: 'set_y',
      colour: 225,
      fields: [{
        name: 'Y', kind: 'number', default: 0, before: 'set y'
      }],
      buildCall: function(v) {return '.set_y(' + v.Y + ')'; }
    });

    defineMobjectMethodBlock({
      type: 'rotate_by',
      colour: 225,
      fields: [
        { name: 'ANGLE', kind: 'number', default: 90, before: 'rotate by', after: 'degrees' }
      ],
      buildCall: function(v) { return '.rotate(' + v.ANGLE + ' * DEGREES)'; }
    });

    // next_to is left hand-written: it needs TWO Mobject sockets
    // (MOBJECT and REFERENCE), which doesn't fit the factory's
    // single-socket shape. Forcing it in would complicate the factory
    // for every other block just to serve this one outlier.
    Blockly.Blocks['next_to'] = {
      init: function() {
        this.appendValueInput('MOBJECT')
          .setCheck('Mobject');
        this.appendDummyInput('')
          .appendField('next to');
        this.appendValueInput('REFERENCE')
          .setCheck('Mobject');
        this.appendDummyInput('')
          .appendField(new Blockly.FieldDropdown(DIRECTIONS), 'DIR');
        this.appendDummyInput('')
          .appendField('buff');
        this.appendDummyInput('')
          .appendField(new Blockly.FieldNumber(0.5, 0, 5), 'BUFF');
        this.setInputsInline(true)
        this.setPreviousStatement(true, ["Action", "Applyable"]);
        this.setNextStatement(true, ["Action", "Applyable"]);
        this.setColour(225);
      }
    };
    Blockly.Blocks['align_to'] = {
      init: function() {
        this.appendValueInput('MOBJECT')
          .setCheck('Mobject');
        this.appendDummyInput('')
          .appendField('align to');
        this.appendValueInput('REFERENCE')
          .setCheck('Mobject');
        this.appendDummyInput('')
          .appendField(new Blockly.FieldDropdown(DIRECTIONS), 'DIR');
        this.setInputsInline(true)
        this.setPreviousStatement(true, ["Action", "Applyable"]);
        this.setNextStatement(true, ["Action", "Applyable"]);
        this.setColour(225);
      }
    };

    // ---- Style blocks ----
    defineMobjectMethodBlock({
      type: 'set_stroke',
      colour: 190,
      tooltip: "Instantly sets a Mobject's stroke color, width, and opacity",
      fields: [
        { name: 'COLOR', kind: 'colour', default: '#ffffff', before: 'set stroke color' },
        { name: 'WIDTH', kind: 'number', default: 4, min: 0, before: 'width' },
        { name: 'OPACITY', kind: 'number', default: 1, min: 0, max: 1, precision: 0.1, before: 'opacity' }
      ],
      buildCall: function(v) { return '.set_stroke(color="' + v.COLOR + '", width=' + v.WIDTH + ', opacity=' + v.OPACITY + ')'; }
    });

    defineMobjectMethodBlock({
      type: 'set_fill',
      colour: 190,
      tooltip: "Instantly sets a Mobject's fill color and opacity",
      fields: [
        { name: 'COLOR', kind: 'colour', default: '#ffffff', before: 'set fill color' },
        { name: 'OPACITY', kind: 'number', default: 1, min: 0, max: 1, precision: 0.1, before: 'opacity' }
      ],
      buildCall: function(v) { return '.set_fill(color="' + v.COLOR + '", opacity=' + v.OPACITY + ')'; }
    });


    // ---- 2. Define blocks turn into Python code ----
    // Mobjects
    python.pythonGenerator.forBlock['circle'] = function(block, generator) {
      var radius = block.getFieldValue('RADIUS');
      var code = 'Circle(radius=' + radius + ')';
      return [code, python.Order.FUNCTION_CALL];
    };
    python.pythonGenerator.forBlock['rectangle'] = function(block, generator) {
      var width = block.getFieldValue('WIDTH');
      var height = block.getFieldValue('HEIGHT');
      var code = 'Rectangle(width=' + width + ', height='+height+')';
      return [code, python.Order.FUNCTION_CALL];
    };
    python.pythonGenerator.forBlock['text'] = function(block, generator) {
      var text = block.getFieldValue('TEXT');
      var font_size = block.getFieldValue('FONT_SIZE')
      var code = 'Text("' + text + '", font_size=' + font_size +')';
      return [code, python.Order.FUNCTION_CALL];
    };
    python.pythonGenerator.forBlock['tex'] = function(block, generator) {
      var tex = block.getFieldValue('TEX');
      var font_size = block.getFieldValue('FONT_SIZE')
      var code = 'Tex(r"' + tex + '", font_size=' + font_size +')';
      return [code, python.Order.FUNCTION_CALL];
    };
    python.pythonGenerator.forBlock['math_tex'] = function(block, generator) {
      var tex = block.getFieldValue('TEX');
      var font_size = block.getFieldValue('FONT_SIZE')
      var code = 'MathTex(r"' + tex + '", font_size=' + font_size +')';
      return [code, python.Order.FUNCTION_CALL];
    };

    // Animations
    // Returns true if this block is directly inside an AnimationGroup's mouth
    function isInsideAnimationGroup(block) {
      var parent = block.getSurroundParent();
      return parent !== null && parent.type === 'animation_group';
    }
    // Returns true if this block is directly inside an Apply Animation's mouth
    function isInsideApplyAnimation(block) {
      var parent = block.getSurroundParent();
      return parent !== null && parent.type === 'apply_animation';
    }
    
    python.pythonGenerator.forBlock['anim_transform'] = function(block, generator) {
      var mobject = generator.valueToCode(block, 'MOBJECT', python.Order.NONE) || 'None';
      var target = generator.valueToCode(block, 'TARGET', python.Order.NONE) || 'None';
      var expr = 'Transform(' + mobject + ', ' + target + ')';
      if (isInsideAnimationGroup(block)) {
        return expr + ',\n';
      }
      return 'self.play(' + expr + ')\n';
    };

        python.pythonGenerator.forBlock['anim_replace'] = function(block, generator) {
      var mobject = generator.valueToCode(block, 'MOBJECT', python.Order.NONE) || 'None';
      var target = generator.valueToCode(block, 'TARGET', python.Order.NONE) || 'None';
      var expr = 'ReplacementTransform(' + mobject + ', ' + target + ')';
      if (isInsideAnimationGroup(block)) {
        return expr + ',\n';
      }
      return 'self.play(' + expr + ')\n';
    };

    python.pythonGenerator.forBlock['anim_wait'] = function(block, generator) {
      var duration = block.getFieldValue('DURATION');
      return 'self.wait(' + duration + ')\n';
    };
    python.pythonGenerator.forBlock['animation_group'] = function(block, generator) {
      var lagRatio = block.getFieldValue('LAG_RATIO');
      var allowedTypes = ['anim_create', 'anim_uncreate', 'anim_fadein', 'anim_fadeout', 'anim_write', 'anim_unwrite', 'anim_transform', 'anim_replace', 'apply_animation'];
      var innerBlock = block.getInputTargetBlock('ANIMATIONS');
      while (innerBlock) {
        if (allowedTypes.indexOf(innerBlock.type) === -1) {
          return '# ERROR: Animation Group can only contain animations. Found "' + innerBlock.type + '".\n';
        }
        innerBlock = innerBlock.getNextBlock();
      }
      var animsCode = generator.statementToCode(block, 'ANIMATIONS');
      return 'self.play(AnimationGroup(\n' + animsCode + generator.INDENT + 'lag_ratio=' + lagRatio + '\n))\n';
    };
    python.pythonGenerator.forBlock['apply_animation'] = function(block, generator) {
      var mobject = generator.valueToCode(block, 'MOBJECT', python.Order.NONE) || 'None';
      var allowedTypes = ['move_to', 'shift', 'set_x', 'set_y', 'next_to', 'align_to', 'to_edge', 'to_corner', 'rotate_by', 'set_stroke', 'set_fill'];
      var innerBlock = block.getInputTargetBlock('METHODS');
      if (!innerBlock) {
        return '# ERROR: Apply Animation needs at least one Positioning or Style block inside it.\n';
      }
      var chain = '';
      while (innerBlock) {
        if (allowedTypes.indexOf(innerBlock.type) === -1) {
          return '# ERROR: Apply Animation can only contain Positioning or Style blocks. Found "' + innerBlock.type + '".\n';
        }
        chain += generator.blockToCode(innerBlock, true);
        innerBlock = innerBlock.getNextBlock();
      }
      var expr = mobject + '.animate' + chain;
      if (isInsideAnimationGroup(block)) {
        return expr + ',\n';
      }
      return 'self.play(' + expr + ')\n';
    };
    // Positioning
    // move_to, shift, to_edge, to_corner, rotate_by, set_stroke, and set_fill
    // all get their generator registered automatically by defineMobjectMethodBlock above.
    // next_to is the one exception, hand-written for its second Mobject socket.
    python.pythonGenerator.forBlock['next_to'] = function(block, generator) {
      var mobject = generator.valueToCode(block, 'MOBJECT', python.Order.NONE) || 'None';
      var ref = generator.valueToCode(block, "REFERENCE", python.Order.NONE) || 'None';
      var dir = block.getFieldValue('DIR');
      var buff = block.getFieldValue('BUFF');
      var call = '.next_to(' + ref + ', ' + dir + ', buff=' + buff + ')';
      if (isInsideApplyAnimation(block)) {
        return call;
      }
      return mobject + call + '\n';
    };
    python.pythonGenerator.forBlock['align_to'] = function(block, generator) {
      var mobject = generator.valueToCode(block, 'MOBJECT', python.Order.NONE) || 'None';
      var ref = generator.valueToCode(block, "REFERENCE", python.Order.NONE) || 'None';
      var dir = block.getFieldValue('DIR');
      var call = '.align_to(' + ref + ', ' + dir + ')';
      if (isInsideApplyAnimation(block)) {
        return call;
      }
      return mobject + call + '\n';
    };

    // ---- 3. Toolbox: add a Mobjects category containing our new block ----
    var toolbox = {
      "kind": "categoryToolbox",
      "contents": [
        {
          "kind": "category",
          "name": "Mobjects",
          "colour": "230",
          "contents": [
            { 
              "kind": "block", "type": "circle"
            },
            {
              "kind": "block", "type": "rectangle"
            },
            {
              "kind": "block", "type": "text"
            },
            {
              "kind": "block", "type": "tex"
            },
            {
              "kind": "block", "type": "math_tex"
            }
          ]
        },
        {
          "kind": "category",
          "name": "Animations",
          "colour": "260",
          "contents": [
            { "kind": "block", "type": "anim_create" },
            { "kind": "block", "type": "anim_uncreate" },
            { "kind": "block", "type": "anim_fadein" },
            { "kind": "block", "type": "anim_fadeout" },
            { "kind": "block", "type": "anim_write" },
            { "kind": "block", "type": "anim_unwrite" },
            { "kind": "block", "type": "anim_wait" },
            { "kind": "block", "type": "anim_transform"},
            { "kind": "block", "type": "anim_replace"},
            { "kind": "block", "type": "animation_group" },
            { "kind": "block", "type": "apply_animation" }
          ]
        },
        {
          "kind": "category",
          "name": "Variables",
          "categorystyle": "variable_category",
          "custom": "VARIABLE"
        },
        {"kind": "category",
          "name": "Positioning",
          "colour": "225",
          "contents": [
            {"kind": "block", "type": "move_to"},
            {"kind": "block", "type": "shift"},
            {"kind": "block", "type": "set_x"},
            {"kind": "block", "type": "set_y"},
            {"kind": "block", "type": "next_to"},
            {"kind": "block", "type": "align_to"},
            {"kind": "block", "type": "to_edge"},
            {"kind": "block", "type": "to_corner"},
            {"kind": "block", "type": "rotate_by"}
            
          ]
        },
        {"kind": "category",
          "name": "Style",
          "colour": "190",
          "contents": [
            {"kind": "block", "type": "set_stroke"},
            {"kind": "block", "type": "set_fill"}
          ]
        }
      ]
    };

    var workspace = Blockly.inject('blocklyDiv', {
      toolbox: toolbox
    });

    // ---- Save / load / clear ----
    var STORAGE_KEY = 'manimBlocksWorkspace';

    function saveWorkspace() {
      var state = Blockly.serialization.workspaces.save(workspace);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    // Restore a saved workspace, if one exists, right after creating the workspace
    var savedState = localStorage.getItem(STORAGE_KEY);
    if (savedState) {
      try {
        Blockly.serialization.workspaces.load(JSON.parse(savedState), workspace);
      } catch (e) {
        console.error('Failed to load saved workspace:', e);
      }
    }

    // Auto-save whenever the workspace actually changes (skip UI-only events like clicks/scrolling)
    workspace.addChangeListener(function(event) {
      if (event.isUiEvent) return;
      saveWorkspace();
    });

    document.getElementById('saveButton').addEventListener('click', function() {
      saveWorkspace();
      var saveStatus = document.getElementById('saveStatus');
      saveStatus.textContent = 'Saved!';
      setTimeout(function() { saveStatus.textContent = ''; }, 1500);
    });

    document.getElementById('clearButton').addEventListener('click', function() {
      var confirmed = confirm('Clear the entire workspace? This cannot be undone.');
      if (!confirmed) return;
      workspace.clear();
      localStorage.removeItem(STORAGE_KEY);
    });

    // ---- 4. Generate Python ----
    document.getElementById('showCodeButton').addEventListener('click', function() {
      var code = python.pythonGenerator.workspaceToCode(workspace);
      document.getElementById('outputArea').textContent = code;
    });
    document.getElementById('renderButton').addEventListener('click', function() {
      var code = python.pythonGenerator.workspaceToCode(workspace);
      var renderButton = document.getElementById('renderButton');
      var statusMessage = document.getElementById('statusMessage');
      var quality = document.getElementById('qual');
      var q = quality.value;

      renderButton.disabled = true;
      statusMessage.textContent = 'Rendering... this may take a moment.';
      statusMessage.classList.remove('error');

      fetch('http://localhost:3000/render', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ code: code , quality: q })
      })
        .then(function(response) {
          if (!response.ok) {
            return response.json().then(function(errorData) {
              throw new Error(errorData.message || 'Render failed.');
            });
          }
          return response.blob();
        })
        .then(function(blob) {
          var videoUrl = URL.createObjectURL(blob);
          document.getElementById('resultVideo').src = videoUrl;
          statusMessage.textContent = 'Done.';
        })
        .catch(function(error) {
          statusMessage.textContent = 'Error: ' + error.message;
          statusMessage.classList.add('error');
        })
        .finally(function() {
          renderButton.disabled = false;
        });
    });
  </script>

</body>
</html>
