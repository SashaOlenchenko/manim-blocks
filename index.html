    // Monaco loads asynchronously via an AMD-style loader, unlike Blockly's
    // scripts which attach a global immediately - so codeEditor stays null

    // against being clicked before that happens.
    var codeEditor = null;
    require.config({ paths: { vs: 'https://cdn.jsdelivr.net/npm/monaco-editor@latest/min/vs' } });

    // Appends a Number-typed socket instead of a plain field, pre-filled with a
    // "shadow" math_number block showing the default value. A shadow block looks
    // and behaves like a normal editable number until something else (a literal,
    // a variable, a math block) gets dragged in to replace it.
    function appendNumberInput(block, name, defaultValue, beforeLabel, afterLabel) {
      if (beforeLabel) block.appendDummyInput('').appendField(beforeLabel);
      var input = block.appendValueInput(name).setCheck('Number');
      input.connection.setShadowState({ type: 'math_number', fields: { NUM: defaultValue || 0 } });
      if (afterLabel) block.appendDummyInput('').appendField(afterLabel);
      return input;
    }

    // Reads a Number-typed socket's value. The fallback only matters if a
    // socket somehow ends up empty, since every socket starts pre-filled
    // with a shadow block.
    function numberValue(block, generator, name, fallback) {
      return generator.valueToCode(block, name, python.Order.NONE) || (fallback || 0);
    }

    // Same idea as appendNumberInput/numberValue, but for Color-typed
    // sockets. The shadow is a color_literal block (defined below), so a
    // socket still looks and behaves like a plain swatch by default - until
    // something else, like a color_gradient block or a color variable, gets
    // dragged in to replace it.
    function appendColorInput(block, name, defaultValue, beforeLabel, afterLabel) {
      if (beforeLabel) block.appendDummyInput('').appendField(beforeLabel);
      var input = block.appendValueInput(name).setCheck('Color');
      input.connection.setShadowState({ type: 'color_literal', fields: { COLOR: defaultValue || '#ffffff' } });
      if (afterLabel) block.appendDummyInput('').appendField(afterLabel);
      return input;
    }
    // A Color-typed socket's connected code is already fully-formed Python
    // (a quoted string, or a bracketed list for a gradient) - unlike plain
    // fields, it never needs extra quoting by whatever reads it.
    function colorValue(block, generator, name, fallback) {
      return generator.valueToCode(block, name, python.Order.NONE) || ('"' + (fallback || '#ffffff') + '"');
    }

    // ---- Animation blocks (statement blocks, not value blocks) ----
    // ---- Animation Blocks Factory
    function defineAnimationBlock(config) {
      Blockly.Blocks[config.type] = {
        init: function() {
          this.appendValueInput('MOBJECT')
          .setCheck('Mobject')
          .appendField(config.name);
          appendNumberInput(this, 'RUN_TIME', config.defaultRunTime || 1, 'run time');
          this.setInputsInline(true);
        this.setPreviousStatement(true, ["Animation", "Action"]);
        this.setNextStatement(true, ["Animation", "Action"]);
        this.setColour(config.colour);
          if (config.tooltip) this.setTooltip(config.tooltip);
        }
      };
      python.pythonGenerator.forBlock[config.type] = function(block, generator) {
      var mobject = generator.valueToCode(block, 'MOBJECT', python.Order.NONE) || 'None';
      var runTime = numberValue(block, generator, 'RUN_TIME', config.defaultRunTime || 1);
      var expr = config.anim + '(' + mobject + ', run_time=' + runTime + ')';
      if (isInsideAnimationGroup(block)) {
        return expr + ',\n';
      }
      return 'self.play(' + expr + ')\n';
    };
  }

    // A factory for blocks that take a variable number of same-typed items,
    // with a proper gear-icon mutator instead of requiring a separate
    // lists_create_with block plugged in. Modeled closely on Blockly's own
    // canonical list mutator (the same mechanism lists_create_with itself
    // uses internally), adapted to the modern saveExtraState/loadExtraState
    // serialization API and Blockly.icons.MutatorIcon.
    function defineVariadicMobjectBlock(config) {
      var containerType = config.type + '_mutator_container';
      var itemType = config.type + '_mutator_item';

      // The popup's header - just a label plus a stack for item placeholders
      Blockly.Blocks[containerType] = {
        init: function() {
          this.appendDummyInput().appendField(config.itemLabel + 's');
          this.appendStatementInput('STACK');
          this.setColour(config.colour);
          this.contextMenu = false;
        }
      };

      // One placeholder block per item, shown inside the popup
      Blockly.Blocks[itemType] = {
        init: function() {
          this.appendDummyInput().appendField(config.itemLabel);
          this.setPreviousStatement(true);
          this.setNextStatement(true);
          this.setColour(config.colour);
          this.contextMenu = false;
        }
      };

      Blockly.Blocks[config.type] = {
        init: function() {
          this.itemCount_ = config.defaultItems || 1;
          this.appendDummyInput('TOP').appendField(config.label);
          this.updateShape_();
          this.setInputsInline(false);
          this.setOutput(true, config.outputCheck || "Mobject");
          this.setColour(config.colour);
          this.setMutator(new Blockly.icons.MutatorIcon([itemType], this));
          if (config.tooltip) this.setTooltip(config.tooltip);
        },

        // Rebuilds the ITEM0, ITEM1, ... sockets to match itemCount_.
        updateShape_: function() {
          var i = 0;
          while (this.getInput('ITEM' + i)) {
            this.removeInput('ITEM' + i);
            i++;
          }
          for (var n = 0; n < this.itemCount_; n++) {
            this.appendValueInput('ITEM' + n)
                .setCheck(config.itemCheck)
                .appendField(config.itemLabel + ' ' + (n+1));
          }
        },

        saveExtraState: function() {
          return { itemCount: this.itemCount_ };
        },
        loadExtraState: function(state) {
          this.itemCount_ = state['itemCount'];
          this.updateShape_();
        },

        // Builds the popup workspace's contents when the gear icon is clicked
        decompose: function(workspace) {
          var containerBlock = workspace.newBlock(containerType);
          containerBlock.initSvg();
          var connection = containerBlock.getInput('STACK').connection;
          for (var i = 0; i < this.itemCount_; i++) {
            var itemBlock = workspace.newBlock(itemType);
            itemBlock.initSvg();
            connection.connect(itemBlock.previousConnection);
            connection = itemBlock.nextConnection;
          }
          return containerBlock;
        },

        // Rebuilds the real block's sockets to match the popup's current stack
        compose: function(containerBlock) {
          var itemBlock = containerBlock.getInputTargetBlock('STACK');
          var connections = [];
          while (itemBlock) {
            connections.push(itemBlock.valueConnection_ || null);
            itemBlock = itemBlock.nextConnection && itemBlock.nextConnection.targetBlock();
          }
          this.itemCount_ = connections.length;
          this.updateShape_();
          for (var i = 0; i < this.itemCount_; i++) {
            if (connections[i]) {
              var input = this.getInput('ITEM' + i);
              connections[i].connect(input.connection);
            }
          }
        },

        // Remembers which existing plugged-in blocks belong to which popup row,
        // so compose() can reconnect them correctly after a rebuild.
        saveConnections: function(containerBlock) {
          var itemBlock = containerBlock.getInputTargetBlock('STACK');
          var i = 0;
          while (itemBlock) {
            var input = this.getInput('ITEM' + i);
            itemBlock.valueConnection_ = input && input.connection.targetConnection;
            i++;
            itemBlock = itemBlock.nextConnection && itemBlock.nextConnection.targetBlock();
          }
        }
      };

      python.pythonGenerator.forBlock[config.type] = function(block, generator) {
        var items = [];
        for (var i = 0; i < block.itemCount_; i++) {
          items.push(generator.valueToCode(block, 'ITEM' + i, python.Order.NONE) || 'None');
        }
        // Most variadic blocks (Polygon, Group) become a function call.
        // A few (like color_gradient) need a different shape, e.g. a plain
        // Python list - config.wrap lets a block override that.
        var code = config.wrap
          ? config.wrap(items)
          : config.constructorName + '(' + items.join(', ') + ')';
        return [code, python.Order.FUNCTION_CALL];
      };
    }

    // ---- Factory for the shared shape of Positioning/Style blocks: ----
    // one Mobject socket, a handful of fields, and a generator that

    function defineMobjectMethodBlock(config) {
      Blockly.Blocks[config.type] = {
        init: function() {
          if (config.leadingLabel) {
            this.appendDummyInput('').appendField(config.leadingLabel);
          }
          this.appendValueInput('MOBJECT').setCheck('Mobject');
          config.fields.forEach(function(f) {
            if (f.kind === 'number') {
              appendNumberInput(this, f.name, f.default, f.before, f.after);
              return;
            }
            if (f.kind === 'colour') {
              appendColorInput(this, f.name, f.default, f.before, f.after);
              return;
            }
            var input = this.appendDummyInput('');
            if (f.before) input.appendField(f.before);
            var field;
            if (f.kind === 'dropdown') {
              field = new Blockly.FieldDropdown(f.options);
            } else {
              field = new Blockly.FieldNumber(f.default, f.min, f.max, f.precision);
            }
            input.appendField(field, f.name);
            if (f.after) input.appendField(f.after);
          }, this);
          this.setInputsInline(true);
          this.setPreviousStatement(true, ["Action", "Applyable"]);
          this.setNextStatement(true, ["Action", "Applyable"]);
          this.setColour(config.colour);
          if (config.tooltip) this.setTooltip(config.tooltip);
        }
      };

        var mobject = generator.valueToCode(block, 'MOBJECT', python.Order.NONE) || 'None';

          if (f.kind === 'number') {
            vals[f.name] = numberValue(block, generator, f.name, f.default);
          } else if (f.kind === 'colour') {
            vals[f.name] = colorValue(block, generator, f.name, f.default);
          } else {
            vals[f.name] = block.getFieldValue(f.name);
          }
        });
        var call = config.buildCall(vals);
        if (isInsideApplyAnimation(block)) {
          return call;
        }
        return mobject + call + '\n';
      };

        'anim_grow_from_center', 'anim_spin_in_from_nothing', 'anim_wiggle', 'anim_flash', 'anim_circumscribe', 'anim_shrink_to_center', 'anim_copy_transform'
      ];
      var innerBlock = block.getInputTargetBlock('ANIMATIONS');

            { "kind": "block", "type": "logic_operation" },
            { "kind": "block", "type": "logic_negate" },
            { "kind": "block", "type": "logic_boolean" },
            { "kind": "block", "type": "logic_ternary" }
          ]
        },
        {
          "kind": "category",
          "name": "Loops",
          "categorystyle": "loop_category",
          "contents": [
            { "kind": "block", "type": "controls_repeat_ext" },
            { "kind": "block", "type": "controls_whileUntil" },
            { "kind": "block", "type": "controls_for" },
            { "kind": "block", "type": "controls_forEach" },
            { "kind": "block", "type": "controls_flow_statements" }
          ]
        },
        {
          "kind": "category",
          "name": "Math",
          "categorystyle": "math_category",
          "contents": [
            { "kind": "block", "type": "math_number" },
            { "kind": "block", "type": "math_arithmetic" },
            { "kind": "block", "type": "math_single" },
            { "kind": "block", "type": "math_trig" },
            { "kind": "block", "type": "math_constant" },
            { "kind": "block", "type": "math_number_property" },
            { "kind": "block", "type": "math_round" },
            { "kind": "block", "type": "math_modulo" },
            { "kind": "block", "type": "math_constrain" },
            { "kind": "block", "type": "math_random_int" },
            { "kind": "block", "type": "math_random_float" }
          ]
        },
        {
          "kind": "category",
          "name": "Lists",
          "categorystyle": "list_category",
          "contents": [
            { "kind": "block", "type": "lists_create_with" },
            { "kind": "block", "type": "list_add_item" },
            { "kind": "block", "type": "lists_repeat" },
            { "kind": "block", "type": "lists_length" },
            { "kind": "block", "type": "lists_isEmpty" },
            { "kind": "block", "type": "lists_indexOf" },
            { "kind": "block", "type": "lists_getIndex" },
            { "kind": "block", "type": "lists_setIndex" },
            { "kind": "block", "type": "lists_getSublist" },
            { "kind": "block", "type": "lists_split" },
            { "kind": "block", "type": "lists_sort" }
          ]
        }
      ]
    };

    var workspace = Blockly.inject('blocklyDiv', {
      toolbox: toolbox,
      theme: 'dark'
    });
    window.dispatchEvent(new Event('resize'));

    // ---- Save / load / clear ----
    var STORAGE_KEY = 'manimBlocksWorkspace';

    function saveWorkspace() {
      var state = Blockly.serialization.workspaces.save(workspace);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    // Restore a saved workspace, if one exists, right after creating the workspace
    var savedState = localStorage.getItem(STORAGE_KEY);
    if (savedState) {
      try {
        Blockly.serialization.workspaces.load(JSON.parse(savedState), workspace);
      } catch (e) {
        console.error('Failed to load saved workspace:', e);
      }
    }

    // Auto-save whenever the workspace actually changes (skip UI-only events like clicks/scrolling)
    workspace.addChangeListener(function(event) {
      if (event.isUiEvent) return;
      saveWorkspace();
    });

    document.getElementById('saveButton').addEventListener('click', function() {
      saveWorkspace();
      var saveStatus = document.getElementById('saveStatus');
      saveStatus.textContent = 'Saved!';
      setTimeout(function() { saveStatus.textContent = ''; }, 1500);
    });

    document.getElementById('clearButton').addEventListener('click', function() {
      var confirmed = confirm('Clear the entire workspace? This cannot be undone.');
      if (!confirmed) return;
      workspace.clear();
      localStorage.removeItem(STORAGE_KEY);
    });

    // ---- View toggle: Blocks <-> Code ----
    // One-way relationship: switching to Code shows whatever the blocks
    // currently generate. Editing that code and switching back to Blocks
    // does NOT change the blocks - there's no way to parse arbitrary
    // hand-edited Python back into a block structure. Render (below)
    // checks which view is active and sends the editor's text when in
    // Code view, so manual edits actually take effect when rendering.
    var viewMode = 'blocks';
    document.getElementById('viewToggleButton').addEventListener('click', function() {
      var toggleButton = document.getElementById('viewToggleButton');
      var blocklyDiv = document.getElementById('blocklyDiv');
      var codeEditorDiv = document.getElementById('codeEditorDiv');

      if (viewMode === 'blocks') {
        if (!codeEditor) {
          alert('The code editor is still loading - try again in a moment.');
          return;
        }
        var code = python.pythonGenerator.workspaceToCode(workspace);
        codeEditor.setValue(code);
        blocklyDiv.classList.add('hidden');
        codeEditorDiv.classList.remove('hidden');
        codeEditor.layout();
        viewMode = 'code';
        toggleButton.textContent = 'Blocks';
      } else {
        codeEditorDiv.classList.add('hidden');
        blocklyDiv.classList.remove('hidden');
        window.dispatchEvent(new Event('resize'));
        viewMode = 'blocks';
        toggleButton.textContent = 'Code';
      }
    });
    document.getElementById('renderButton').addEventListener('click', function() {
      var code = (viewMode === 'code' && codeEditor)
        ? codeEditor.getValue()
        : python.pythonGenerator.workspaceToCode(workspace);
      var renderButton = document.getElementById('renderButton');
      var statusMessage = document.getElementById('statusMessage');
      var quality = document.getElementById('qual');
      var q = quality.value;

      renderButton.disabled = true;
      statusMessage.textContent = 'Rendering... this may take a moment.';
      statusMessage.classList.remove('error');

      fetch('http://localhost:3000/render', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ code: code , quality: q })
      })
        .then(function(response) {
          if (!response.ok) {
            return response.json().then(function(errorData) {
              throw new Error(errorData.message || 'Render failed.');
            });
          }
          return response.blob();
        })
        .then(function(blob) {
          var videoUrl = URL.createObjectURL(blob);
          document.getElementById('resultVideo').src = videoUrl;
          statusMessage.textContent = 'Done.';
        })
        .catch(function(error) {
          statusMessage.textContent = 'Error: ' + error.message;
          statusMessage.classList.add('error');
        })
        .finally(function() {
          renderButton.disabled = false;
        });
    });
  </script>

</body>
</html>
